services:
  bot:
    build: .
    container_name: lin-bot
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - NODE_ENV=development
      - BOTTOKEN=${BOTTOKEN}
      - MONGODB_URI=mongodb://db:27017/lin-bot
    command: npx nodemon -L index.js
    volumes:
      - .:/usr/src/app
      - lin_bot_node_modules:/usr/src/app/node_modules
    depends_on:
      - db

  db:
    image: mongo:8.0
    container_name: lin-bot-db
    restart: always
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

volumes:
  mongo_data:
  lin_bot_node_modules:
